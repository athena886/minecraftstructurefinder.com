<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page Not Found - Minecraft Structure Finder</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f5f7f4; color: #202420; font-family: Inter, system-ui, sans-serif; }
      main { width: min(520px, 100%); padding: 48px 34px; border: 1px solid #dfe4df; border-radius: 14px; background: #fff; text-align: center; box-shadow: 0 18px 50px rgba(33, 49, 35, .08); }
      .block { width: 42px; height: 42px; margin: 0 auto 22px; border-radius: 5px; background: linear-gradient(#6bc46f 0 33%, #77543b 33% 68%, #a77b57 68%); box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
      h1 { margin: 0; font-size: clamp(30px, 7vw, 44px); letter-spacing: -.04em; }
      p { margin: 14px 0 25px; color: #68706a; line-height: 1.6; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 18px; border-radius: 8px; background: #4caf50; color: #fff; font-weight: 750; text-decoration: none; }
      a:hover { background: #338738; }
    </style>
  </head>
  <body>
    <main>
      <div class="block" aria-hidden="true"></div>
      <h1>Page not found</h1>
      <p>This path does not exist. Return to the Minecraft Structure Finder to search a seed.</p>
      <a href="/">Back to Structure Finder</a>
    </main>
  </body>
</html>
